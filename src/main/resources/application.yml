spring:
  application:
    name: settlement
  datasource:
    url: jdbc:h2:mem:creator-settlement;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true
  mvc:
    problemdetails:
      # 프레임워크가 던지는 실패(405, 415, 없는 경로)도 RFC 9457로 나가게 한다.
      # 끄면 그 응답들은 본문이 비어 나가고 "모든 오류가 한 모양"이 거짓이 된다.
      enabled: true
  jackson:
    # OffsetDateTime을 그대로 두면 Jackson이 UTC로 정규화해 +09:00이 Z가 된다.
    # 타입만 OffsetDateTime으로 바꿔서는 KST 표기가 유지되지 않는다.
    time-zone: Asia/Seoul
  h2:
    console:
      enabled: true
      path: /h2-console

# 플랫폼 수수료율. basis point이며 2000 = 20%다.
# 도메인은 이 값을 갖지 않고 주입받기만 한다. Task 4가 바인딩해
# FixedRateFeePolicy를 조립한다. Task 4가 Spring 배선이 생기는 첫 Task다.
#
# 요율을 바꾸면 이미 조회한 과거 정산이 달라진다. 시점별 이력 적용은
# 구현하지 않았으므로 변경은 배포 시점에만 하고 기록을 남긴다.
settlement:
  fee:
    basis-points: 2000
